<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Assistant</title>
<style>
:root{--bg:#EEF1F6;--surface:#fff;--ink:#14213D;--muted:#5B6678;--line:#D5DBE6;--accent:#3A5BDC;--err:#B3261E}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font:700 18px Georgia,"Times New Roman",serif;margin:0}
header div{display:flex;gap:4px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer}
.link:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:85%;background:var(--accent);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{max-width:62ch;overflow-wrap:anywhere}
.a p,.a ul,.a ol{margin:0 0 .7em}.a>:last-child{margin-bottom:0}
.a pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:14px}
.a code{background:#E1E6F0;padding:1px 5px;border-radius:4px;font-size:.92em}.a pre code{background:none;padding:0}
.hint{color:var(--muted)}
.empty{padding-top:8vh}
.empty h2{font:700 32px/1.15 Georgia,"Times New Roman",serif;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink);cursor:pointer}
#err{display:none;color:var(--err);padding:8px 16px;max-width:680px;margin:0 auto;width:100%;font-size:15px}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
form>div{flex:1;max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
#msg{resize:none;max-height:160px;flex:1}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;height:44px}
#send:disabled{opacity:.5}
dialog{border:0;border-radius:16px;padding:20px;width:min(520px,92vw);color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(20,33,61,.45)}
dialog h2{font:700 20px Georgia,serif;margin:0 0 12px}
label{display:block;font-weight:600;margin:14px 0 4px}
small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.row .primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.dots{animation:p 1.2s infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<header>
  <h1>My Assistant</h1>
  <div><button class="link" id="new">New chat</button><button class="link" id="open">Settings</button></div>
</header>
<main id="log"><div class="wrap" id="wrap"></div></main>
<div id="err" role="alert"></div>
<form id="f"><div>
  <textarea id="msg" rows="1" placeholder="Message your assistant" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</div></form>

<dialog id="dlg">
  <h2>Settings</h2>
  <label for="key">Gemini API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Paste your key here">
  <small>Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a>. It is saved only on this device. On the free tier, Google may use what you send to improve its products.</small>
  <label for="model">Model</label>
  <input id="model" autocomplete="off">
  <small>If you see a “model not found” message, change this to another current Gemini Flash model name from AI Studio.</small>
  <label for="instr">How the assistant should behave</label>
  <textarea id="instr" rows="9"></textarea>
  <div class="row"><button class="link" id="reset" type="button">Reset text</button><button class="link" id="cancel" type="button">Cancel</button><button class="primary" id="save" type="button">Save</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const S={get(k,d){try{const v=localStorage.getItem('pa.'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('pa.'+k,JSON.stringify(v))}catch{}}};
const DEFAULT_MODEL='gemini-2.5-flash';
const DEFAULT_INSTR=`You are my personal assistant. Be warm, brief and practical. Use plain language and avoid jargon. If you need more information, ask one question at a time.

Safety rules:
- You cannot send, delete, buy or change anything yourself. If I ask for something like that, prepare a draft or a plan and tell me what I would need to approve.
- Never ask for passwords or card numbers.
- If you are not sure about a fact, say so instead of guessing.`;
let chat=S.get('chat',[]),busy=false;

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function block(b){
  const L=b.split('\n'),li=/^\s*([-*]|\d+\.)\s+/;
  if(L.every(l=>li.test(l))){const t=/^\s*\d/.test(L[0])?'ol':'ul';return `<${t}>`+L.map(l=>'<li>'+inl(l.replace(li,''))+'</li>').join('')+`</${t}>`}
  return '<p>'+inl(L.join('<br>'))+'</p>';
}
const md=s=>esc(s).split(/```\w*\n?/).map((p,i)=>i%2?`<pre><code>${p}</code></pre>`:p.split(/\n{2,}/).filter(x=>x.trim()).map(block).join('')).join('');

function render(pending){
  const w=$('#wrap');w.innerHTML='';
  if(!chat.length&&!pending){
    const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
    w.innerHTML=`<div class="empty"><h2>${g}.</h2><p class="hint">What can I help you with?</p><div class="chips"></div></div>`;
    ['Plan my day','Draft a message','Explain something simply'].forEach(t=>{
      const b=document.createElement('button');b.className='chip';b.textContent=t;
      b.onclick=()=>{$('#msg').value=t+': ';$('#msg').focus()};w.querySelector('.chips').append(b);
    });
  }
  chat.forEach(m=>{const d=document.createElement('div');
    if(m.role==='user'){d.className='u';d.textContent=m.text}else{d.className='a';d.innerHTML=md(m.text)}
    w.append(d)});
  if(pending){const d=document.createElement('div');d.className='a hint dots';d.textContent='Thinking…';w.append(d)}
  $('#log').scrollTop=$('#log').scrollHeight;
}
function showErr(t){const e=$('#err');e.textContent=t||'';e.style.display=t?'block':'none'}
function friendly(status,d){
  const m=d&&d.error&&d.error.message||'';
  if(status===400&&/api key/i.test(m)||status===403)return 'Your API key wasn’t accepted. Open Settings and paste it again.';
  if(status===404)return 'That model name wasn’t found. Open Settings and try gemini-2.5-flash.';
  if(status===429)return 'The free limit was reached for now. Wait a minute and try again.';
  return m||`Something went wrong (code ${status}). Try again.`;
}
async function send(text){
  text=text.trim();if(!text||busy)return;
  const key=S.get('key','');if(!key){openSettings();return}
  showErr('');busy=true;$('#send').disabled=true;
  chat.push({role:'user',text});render(true);$('#msg').value='';grow();
  try{
    const when=new Date().toLocaleString([], {dateStyle:'full',timeStyle:'short'});
    const body={system_instruction:{parts:[{text:S.get('instr',DEFAULT_INSTR)+'\n\nCurrent date and time: '+when}]},
      contents:chat.slice(-30).map(m=>({role:m.role,parts:[{text:m.text}]}))};
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.get('model',DEFAULT_MODEL))}:generateContent`,
      {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(friendly(r.status,d));
    const t=((d.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if(!t)throw new Error('The assistant sent back an empty reply. Try rephrasing your message.');
    chat.push({role:'model',text:t});S.set('chat',chat);
  }catch(e){
    chat.pop();$('#msg').value=text;grow();
    showErr(e instanceof TypeError?'Can’t reach the internet. Check your connection and try again.':e.message);
  }
  busy=false;$('#send').disabled=false;render();
}
function grow(){const t=$('#msg');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function openSettings(){$('#key').value=S.get('key','');$('#model').value=S.get('model',DEFAULT_MODEL);$('#instr').value=S.get('instr',DEFAULT_INSTR);$('#dlg').showModal()}

$('#f').onsubmit=e=>{e.preventDefault();send($('#msg').value)};
$('#msg').oninput=grow;
$('#msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send($('#msg').value)}};
$('#new').onclick=()=>{if(busy)return;chat=[];S.set('chat',chat);showErr('');render()};
$('#open').onclick=openSettings;
$('#cancel').onclick=()=>$('#dlg').close();
$('#reset').onclick=()=>{$('#instr').value=DEFAULT_INSTR};
$('#save').onclick=()=>{S.set('key',$('#key').value.trim());S.set('model',$('#model').value.trim()||DEFAULT_MODEL);S.set('instr',$('#instr').value.trim()||DEFAULT_INSTR);showErr('');$('#dlg').close()};

render();
if(!S.get('key',''))openSettings();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
